# offsec-dotfiles :: base neutra do mouse (libinput/Xorg)
#
# Instalar:  sudo install -Dm644 ~/.config/offsec/system/xorg-mouse-accel.conf \
#                /etc/X11/xorg.conf.d/50-mouse-accel.conf
#            (ou rode o install-performance.sh, que já faz isto)
#
# A sensibilidade NÃO se ajusta aqui. Quem manda é a GUI:
#   Super + Alt + M      (ou ~/.config/offsec/bin/mouse-settings.py)
# que grava em ~/.config/offsec/mouse.json e o reaplica a cada login e a cada
# reconexão do mouse. Editar este arquivo à mão volta a ser o problema que a
# GUI existe para resolver.
#
# Este arquivo só fixa um ponto de partida previsível: 0.0 é o padrão do
# libinput. Deixá-lo em 1.0 (como estava) fazia o mouse nascer na velocidade
# máxima a cada login, até o mouse.json ser reaplicado.

Section "InputClass"
        Identifier "offsec mouse base"
        MatchDriver "libinput"
        MatchIsPointer "on"
        Option "AccelProfile" "adaptive"
        Option "AccelSpeed" "0.0"
EndSection
