# BSPWM-dotfiles :: neutral mouse baseline (libinput/Xorg)
#
# Install: sudo install -Dm644 ~/.config/offsec/system/xorg-mouse-accel.conf \
#              /etc/X11/xorg.conf.d/50-mouse-accel.conf
# Or run install-performance.sh to install it.
#
# Adjust sensitivity through the GUI:
#   Super + Alt + M (or ~/.config/offsec/bin/mouse-settings.py)
# It saves ~/.config/offsec/mouse.json and reapplies it at every login
# and mouse reconnection. Manual edits here can conflict with those settings.
#
# Set a predictable baseline: 0.0 is the libinput default.
# Using 1.0 started the mouse at maximum speed on each login
# until mouse.json was reapplied.

Section "InputClass"
        Identifier "offsec mouse base"
        MatchDriver "libinput"
        MatchIsPointer "on"
        Option "AccelProfile" "adaptive"
        Option "AccelSpeed" "0.0"
EndSection
