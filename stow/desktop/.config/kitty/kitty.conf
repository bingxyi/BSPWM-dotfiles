# BSPWM-dotfiles :: kitty
# Colors come from current-theme.conf, generated by theme.sh. Do not edit it.

include current-theme.conf

#: ------------------------------------------------------------------ font
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5
disable_ligatures never
modify_font underline_position 2
modify_font underline_thickness 1.4
modify_font cell_height 108%
text_composition_strategy platform

#: ----------------------------------------------------------------- window
window_padding_width      14 16
hide_window_decorations   yes
confirm_os_window_close   0
remember_window_size      no
initial_window_width      1200
initial_window_height     720
placement_strategy        center
background_opacity        0.92
background_blur           0
dynamic_background_opacity yes
inactive_text_alpha       1.0
window_border_width       0
draw_minimal_borders      yes

#: ------------------------------------------------------------------ cursor
cursor_shape              beam
cursor_beam_thickness     1.8
cursor_blink_interval     0.5 ease-in-out
cursor_stop_blinking_after 12.0
cursor_trail              3
cursor_trail_decay        0.08 0.35
cursor_trail_start_threshold 8

#: ------------------------------------------------------------------ scroll
scrollback_lines          20000
scrollback_pager          less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier   4.0
touch_scroll_multiplier   2.0

#: -------------------------------------------------------------------- tabs
tab_bar_edge              top
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          2
tab_activity_symbol       " "
active_tab_font_style     bold
inactive_tab_font_style   normal
tab_title_template        "{index}  {title[:22]}"

#: ------------------------------------------------------------------ layout
enabled_layouts splits:split_axis=horizontal,stack,tall,fat,grid
window_resize_step_cells 2
window_resize_step_lines 2

#: ------------------------------------------------------------------- other
shell                     /usr/bin/fish
shell_integration         enabled
allow_remote_control      no
enable_audio_bell         no
visual_bell_duration      0.0
bell_on_tab               "🔔 "
update_check_interval     0
notify_on_cmd_finish      unfocused 15.0
copy_on_select            no
strip_trailing_spaces     smart
select_by_word_characters :@-./_~?&=%+#
mouse_hide_wait           2.0
url_style                 curly
detect_urls               yes
open_url_with             default
sync_to_monitor           yes
repaint_delay             8
input_delay               2

#: ----------------------------------------------------------------- shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+h show_scrollback
map ctrl+shift+f5 load_config_file
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+l next_layout
map ctrl+shift+o launch --type=overlay --stdin-source=@screen_scrollback nvim -
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>l kitten hints --type line --program -
map ctrl+shift+p>h kitten hints --type hash --program -
map ctrl+shift+p>i kitten hints --type ip --program @

#: Change background opacity on demand to see content underneath.
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1

#: Use the default theme until theme.sh runs for the first time.
