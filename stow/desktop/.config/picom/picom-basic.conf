# BSPWM-dotfiles :: fallback without animations (official repository picom)

#################################
#            Backend            #
#################################
backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
xrender-sync-fence = true;   # Proprietary NVIDIA: avoid tearing and stalls.
unredir-if-possible = false;
detect-transient = true;
detect-client-leader = true;
detect-rounded-corners = true;
detect-client-opacity = true;

#################################
#                      Corners             #
#################################
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'eww-bar'",
  "class_g = 'i3lock'"
];

#################################
#                      Shadows             #
#################################
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -14;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Polybar'",
  "class_g = 'eww-bar'",
  "_GTK_FRAME_EXTENTS@:c",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#            Fading             #
#################################
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;
fade-exclude = [ "class_g = 'i3lock'" ];

#################################
#                    Opacity             #
#################################
inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.06;

opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'Chromium'",
  "100:class_g *?= 'burp'",
  "100:class_g *?= 'Burp'",
  "100:class_g = 'ZAP'",
  "100:class_g = 'jadx-gui'",
  "100:class_g = 'ghidra-Ghidra'",
  "100:class_g = 'Wireshark'",
  "100:name *?= 'Ghidra'",
  "100:fullscreen",
  "100:class_g = 'i3lock'",
  "100:class_g = 'kitty'",
  "92:class_g = 'Thunar'",
  "100:class_g = 'Polybar'",
  "100:class_g = 'eww-bar'"
];

#################################
#             Blur              #
#################################
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
};
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g *?= 'burp'",
  "class_g = 'ZAP'",
  "class_g = 'ghidra-Ghidra'",
  "_GTK_FRAME_EXTENTS@:c"
];


#################################
#                  Window types          #
#################################
wintypes:
{
  normal = { fade = true; shadow = true; };
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; };
  dock = { shadow = false; blur-background = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.96; shadow = true; };
  dropdown_menu = { opacity = 0.96; shadow = true; };
  utility = { shadow = true; };
};
