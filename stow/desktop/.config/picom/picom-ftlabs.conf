# rice :: FT-Labs spring animations, selected by capability instead of git version strings.

#################################
#            Backend            #
#################################
backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
xrender-sync-fence = false;   # No extra proprietary-driver fence on the Intel path.
unredir-if-possible = false;  # Keep one GL surface across fullscreen/workspace changes.
detect-transient = true;
detect-client-leader = true;
detect-rounded-corners = true;
detect-client-opacity = true;

#################################
#                      Corners             #
#################################
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'eww-bar'",
  "class_g = 'RiceMotion'",
  "class_g = 'i3lock'"
];

#################################
#                      Shadows             #
#################################
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -14;
shadow-exclude = [
  "class_g = 'RiceMotion'",
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Polybar'",
  "class_g = 'eww-bar'",
  "_GTK_FRAME_EXTENTS@:c",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#            Fading             #
#################################
fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;
fade-delta = 8;
fade-exclude = [ "class_g = 'i3lock'", "class_g = 'RiceMotion'" ];

#################################
#                    Opacity             #
#################################
inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.06;

opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'Chromium'",
  "100:class_g *?= 'burp'",
  "100:class_g *?= 'Burp'",
  "100:class_g = 'ZAP'",
  "100:class_g = 'jadx-gui'",
  "100:class_g = 'ghidra-Ghidra'",
  "100:class_g = 'Wireshark'",
  "100:name *?= 'Ghidra'",
  "100:fullscreen",
  "100:class_g = 'RiceMotion'",
  "100:class_g = 'i3lock'",
  "100:class_g = 'kitty'",
  "92:class_g = 'Thunar'",
  "100:class_g = 'Polybar'",
  "100:class_g = 'eww-bar'"
];

#################################
#             Blur              #
#################################
blur: {
  method = "dual_kawase";
  strength = 3;
  background = true;
  background-frame = false;
  background-fixed = false;
};
blur-background-exclude = [
  "class_g = 'RiceMotion'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g *?= 'burp'",
  "class_g = 'ZAP'",
  "class_g = 'ghidra-Ghidra'",
  "_GTK_FRAME_EXTENTS@:c"
];


#################################
#                  Window types          #
#################################
wintypes:
{
  normal = { fade = true; shadow = true; };
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; };
  dock = { shadow = false; blur-background = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.96; shadow = true; };
  dropdown_menu = { opacity = 0.96; shadow = true; };
  utility = { shadow = true; };
};

# Near-critical damping: settle without long oscillation or rubber-band overshoot.
animations = true;
animation-stiffness-in-tag = 250.0;
animation-stiffness-tag-change = 220.0;
animation-window-mass = 0.6;
animation-dampening = 24.0;
animation-clamping = false;
animation-for-open-window = "slide-up";
animation-for-unmap-window = "slide-down";
animation-for-transient-window = "slide-up";
animation-for-prev-tag = "slide-left";
animation-for-next-tag = "slide-right";
enable-fading-prev-tag = true;
enable-fading-next-tag = true;
animation-exclude = [
  "window_type = 'dock'", "window_type = 'desktop'",
  "class_g = 'RiceMotion'", "class_g = 'i3lock'",
  "window_type = 'tooltip'", "window_type = 'dnd'"
];
