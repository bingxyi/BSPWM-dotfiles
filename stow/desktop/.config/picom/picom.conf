# BSPWM-dotfiles :: official picom v12+ (picom package in the extra repository)
#
# picom 12 introduced native animations, removing the need for the FT-Labs
# fork. This file uses the animations and rules syntax.
# For picom 10/11, picom-launch.sh selects picom-basic.conf instead.

#################################
#            Backend            #
#################################
backend = "glx";
vsync = true;
use-damage = true;           # Repaint only damaged regions; compatible with picom 12+ animations.
xrender-sync-fence = true;   # Proprietary NVIDIA: avoid tearing and stalls.

# Unredirect fullscreen video and games for a direct path to NVIDIA.
# Dock exclusions live in rules; picom 13 ignores unredir-if-possible-exclude.
unredir-if-possible = true;
detect-transient = true;
detect-client-opacity = true;
detect-rounded-corners = true;
log-level = "warn";

#################################
#                        Corners            #
#################################
corner-radius = 12;

#################################
#                        Shadows            #
#################################
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -14;
shadow-color = "#000000";

#################################
#                      Opacity            #
#################################
# Do not set inactive-opacity, active-opacity, inactive-opacity-override,
# or inactive-dim here. In picom 12+, a rules block takes precedence and
# those options are ignored with one startup warning each.
# The first rule below implements their intended behavior.
frame-opacity = 1.0;

#################################
#              Blur             #
#################################
blur: {
  method = "dual_kawase";
  strength = 3;
  background = true;
  background-frame = false;
  background-fixed = false;
};

#################################
#                      Animations          #
#################################
# picom 12 presets: appear, disappear, fly-in, fly-out,
# slide-in, slide-out, geometry-change.
animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.18;
    scale = 0.94;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.15;
    scale = 0.94;
  },
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.20;
  }
);

#################################
#             Per-window rules        #
#################################
# Keep analysis tools fully opaque so report screenshots
# remain readable and suitable as evidence.
rules = (
  {
    # Unfocused windows: replaces inactive-opacity and inactive-dim.
    # Keep this rule first so later rules can override it
    # and analysis tools remain fully opaque.
    match = "!focused";
    opacity = 0.94;
    dim = 0.06;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
  },
  {
    match = "class_g = 'i3lock'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
    opacity = 1.0;
  },
  {
    match = "fullscreen";
    shadow = false;
    corner-radius = 0;
    opacity = 1.0;
  },
  {
    match = "class_g *?= 'burp' || class_g = 'ZAP' || class_g = 'jadx-gui' || class_g = 'Wireshark' || name *?= 'Ghidra'";
    opacity = 1.0;
    blur-background = false;
  },
  {
    match = "class_g = 'firefox' || class_g = 'Chromium'";
    opacity = 1.0;
  },
  {
    match = "class_g = 'kitty' && focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "class_g = 'kitty' && !focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "class_g = 'Thunar'";
    opacity = 0.94;
  },
  {
    match = "window_type = 'tooltip' || window_type = 'dnd'";
    shadow = false;
  },
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    opacity = 0.96;
  }
);
