# offsec-dotfiles :: picom oficial v12+ (pacote `picom` do repositório extra)
#
# O picom 12 trouxe animações nativas — o fork FT-Labs deixou de ser
# necessário e por isso não é mais instalado. Este arquivo usa a sintaxe
# nova (`animations` + `rules`). Em picom 10/11 ele não é lido: o
# picom-launch.sh detecta a versão e usa o picom-basic.conf.

#################################
#            Backend            #
#################################
backend = "glx";
vsync = true;
use-damage = true;           # repinta só a região suja (picom 12+ anima bem com isto)
xrender-sync-fence = true;   # NVIDIA proprietária: evita tearing e travadas

# Tela cheia sem compositor: vídeo e jogos ganham o caminho direto pro NVIDIA.
# (a exclusão de docks vive em `rules`; picom 13 ignora unredir-if-possible-exclude)
unredir-if-possible = true;
detect-transient = true;
detect-client-opacity = true;
detect-rounded-corners = true;
log-level = "warn";

#################################
#            Cantos             #
#################################
corner-radius = 12;

#################################
#            Sombras            #
#################################
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -14;
shadow-color = "#000000";

#################################
#          Transparência        #
#################################
# inactive-opacity / active-opacity / inactive-opacity-override / inactive-dim
# NAO entram aqui. A partir do picom 12, se existir um bloco `rules` ele tem
# precedencia e essas quatro sao ignoradas -- com um WARN por opcao no
# arranque. A intencao delas virou a primeira regra do bloco `rules` abaixo.
frame-opacity = 1.0;

#################################
#              Blur             #
#################################
blur: {
  method = "dual_kawase";
  strength = 3;
  background = true;
  background-frame = false;
  background-fixed = false;
};

#################################
#           Animações           #
#################################
# Presets do picom 12: appear, disappear, fly-in, fly-out,
# slide-in, slide-out, geometry-change.
animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.18;
    scale = 0.94;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.15;
    scale = 0.94;
  },
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.20;
  }
);

#################################
#      Regras por janela        #
#################################
# Ferramentas de análise ficam 100% opacas de propósito: capturas de tela
# com transparência viram prova ruim em relatório.
rules = (
  {
    # Janela sem foco: e o que `inactive-opacity` + `inactive-dim` faziam.
    # Primeira da lista de proposito -- as regras seguintes sobrescrevem, e
    # as ferramentas de analise continuam 100% opacas.
    match = "!focused";
    opacity = 0.94;
    dim = 0.06;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
  },
  {
    match = "class_g = 'i3lock'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
    opacity = 1.0;
  },
  {
    match = "fullscreen";
    shadow = false;
    corner-radius = 0;
    opacity = 1.0;
  },
  {
    match = "class_g *?= 'burp' || class_g = 'ZAP' || class_g = 'jadx-gui' || class_g = 'Wireshark' || name *?= 'Ghidra'";
    opacity = 1.0;
    blur-background = false;
  },
  {
    match = "class_g = 'firefox' || class_g = 'Chromium'";
    opacity = 1.0;
  },
  {
    match = "class_g = 'kitty' && focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "class_g = 'kitty' && !focused";
    opacity = 1.0;
    dim = 0.0;
  },
  {
    match = "class_g = 'Thunar'";
    opacity = 0.94;
  },
  {
    match = "window_type = 'tooltip' || window_type = 'dnd'";
    shadow = false;
  },
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    opacity = 0.96;
  }
);
